# TASK-003 — CI baseline.
#
# 08_TESTING.md § CI Requirements: every PR must pass lint, type-check, the unit
# suite, and the integration suite against mocked external services. Real-API
# tests are marked `real_api` and excluded here by the pytest addopts; they run
# on the nightly job below.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly real-API run (08_TESTING.md § Mocking boundaries).
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: auditlens
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: auditlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditlens -d auditlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://auditlens:ci_password@localhost:5432/auditlens_test
      SESSION_SECRET: ci-only-not-a-real-secret-value-000000000000
      LLM_API_KEY: ci-placeholder
      FILE_STORAGE_PATH: /tmp/auditlens-evidence
      CORS_ALLOWED_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: |
          .venv/bin/ruff check app tests migrations
          .venv/bin/ruff format --check app tests migrations

      - name: Type check (mypy)
        working-directory: backend
        run: .venv/bin/mypy app

      - name: Install OCR toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Run migrations
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      - name: Tests
        working-directory: backend
        run: .venv/bin/pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Backend dependency audit
        working-directory: backend
        # 05_SECURITY.md §10.10 — run before every deployment, not ad hoc.
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip compile pyproject.toml --extra dev -o requirements.txt
          .venv/bin/pip-audit -r requirements.txt --strict --desc

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

      - name: Reject committed secrets
        # Catches the failure mode 05_SECURITY.md §10.6 names directly: a real
        # .env or a hardcoded key reaching version control.
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked in git."
            exit 1
          fi
          if git grep -nIE 'sk-[A-Za-z0-9_-]{20,}' -- ':!*.md' ':!.github/*' ':!backend/tests/test_secret_hygiene.py'; then
            echo "::error::A value matching an API key pattern is committed."
            exit 1
          fi
